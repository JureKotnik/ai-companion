<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Astra AI (Live2D)</title>
    
    <link rel="stylesheet" href="/static/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.2/browser/pixi.min.js"></script>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

</head>

<body>
    <canvas id="canvas"></canvas>
    <a href="/" class="switch-link">➡ SWITCH TO 3D</a>

    <div id="click-overlay"><div>▶ CLICK TO WAKE UP</div></div>
    <div id="loading" style="z-index: 2000; position: absolute; color: white;">Loading Live2D...</div>
    
    <div id="response-text"></div>

    <div id="expression-bar">
        <button class="exp-btn" onclick="triggerExp('Reset')">Reset</button>
        <button class="exp-btn" onclick="triggerExp('Amazed')">Amazed</button>
        <button class="exp-btn" onclick="triggerExp('Angry')">Angry</button>
        <button class="exp-btn" onclick="triggerExp('Cry')">Cry</button>
        <button class="exp-btn" onclick="triggerExp('Love')">Love</button>
        <button class="exp-btn" onclick="triggerExp('Nervous')">Nervous</button>
        <button class="exp-btn" onclick="triggerExp('Sleepy')">Sleepy</button>
        <button class="exp-btn" onclick="triggerExp('Happy')">Happy</button>
        <button class="exp-btn" onclick="triggerExp('Sad')">Sad</button>
        <button class="exp-btn" onclick="triggerExp('Surprised')">Surprised</button>
        <button class="exp-btn" onclick="triggerExp('Smug')">Smug</button>
        <button class="exp-btn" onclick="triggerExp('Embarrassed')">Embarrassed</button>
        <button class="exp-btn" onclick="triggerExp('Confused')">Confused</button>
        <button class="exp-btn" onclick="triggerExp('Disgusted')">Disgusted</button>
        <button class="exp-btn" onclick="triggerExp('Excited')">Excited</button>
        <button class="exp-btn" onclick="triggerExp('Bored')">Bored</button>
        <button class="exp-btn" onclick="triggerExp('Scared')">Scared</button>
        <button class="exp-btn" onclick="triggerExp('Thinking')">Thinking</button>
        <button class="exp-btn" onclick="triggerExp('Disappointed')">Disappointed</button>
        <button class="exp-btn" onclick="triggerExp('Smiling')">Smiling</button>
        <button class="exp-btn" onclick="triggerExp('Laughing')">Laughing</button>
        <button class="exp-btn" onclick="triggerExp('Wink')">Wink</button>
        <button class="exp-btn" onclick="triggerExp('Determined')">Determined</button>
    </div>

    <div id="ui-container">
        <div class="mode-switch">
            <button class="mode-btn active" onclick="setMode('text')">⌨ TEXT</button>
            <button class="mode-btn" onclick="setMode('voice')">🎤 VOICE</button>
        </div>
        <div id="text-area" class="visible">
            <input type="text" id="msg-input" placeholder="Type message..." autocomplete="off">
            <button class="send-btn" onclick="sendText()">SEND</button>
        </div>
        <div id="voice-area">
            <button id="mic-btn">Hold SPACE to Speak</button>
        </div>
    </div>

    <script src="/static/live2d/movements.js"></script>

<script>
    const MODEL_PATH = '/static/live2d/model/demongirl.model3.json'; 
    let app, model; 
    let audioContext, analyser, dataArray, isSpeaking = false;
    const socket = io();

    // --- IDLE TIMER HOOKS ---
    // These tell movements.js "I am still here!" so she doesn't fall asleep while you type.
    
    window.addEventListener('mousedown', () => {
        if (typeof resetIdleTimer === "function") resetIdleTimer();
    });

    document.getElementById('msg-input').addEventListener('input', () => {
        if (typeof resetIdleTimer === "function") resetIdleTimer();
    });

    // --- PIXI INITIALIZATION ---
    function initPixi() {
        const canvasElement = document.getElementById('canvas');
        
        app = new PIXI.Application({
            view: canvasElement,
            resizeTo: window,
            transparent: true, 
            autoDensity: true,
            antialias: true
        });

        PIXI.live2d.Live2DModel.from(MODEL_PATH, { autoInteract: false }).then((loadedModel) => {
            model = loadedModel;
            app.stage.addChild(model);
            
            model.anchor.set(0.5, 0.5);
            model.x = window.innerWidth / 2;
            model.y = window.innerHeight / 2 + 100;
            const scale = (window.innerHeight * 0.4) / model.height;
            model.scale.set(scale);

            document.getElementById('loading').style.display = 'none';
            app.ticker.add(animate);

            // Debug Logs
            console.log("--- MODEL LOADED ---");
            const refs = model.internalModel.settings.json.FileReferences;
            console.log("Files found in JSON:", refs);
            
            if (refs.Expressions) {
                console.log("✅ Expressions detected:", refs.Expressions);
            } else {
                console.warn("❌ No 'Expressions' found in model3.json!");
            }

        }).catch(err => {
            console.error("FAILED TO LOAD MODEL:", err);
            document.getElementById('loading').innerText = "Load Failed: " + err;
        });
    }
    
    function triggerExp(name) {
        if (model) setExpression(model, name);
    }

    function animate() {
        if (!model) return;
        let time = Date.now() / 1000;
        animateLive2D(model, time, isSpeaking);
        animateMouthLive2D(model, analyser, dataArray, isSpeaking);
    }

    // --- INPUT HANDLERS ---
    
    // Wake up on first click
    document.getElementById('click-overlay').addEventListener('click', function() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        if(audioContext.state === 'suspended') audioContext.resume();
        this.style.display = 'none';
        initPixi(); 
    });

    function setMode(mode) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.mode-btn[onclick="setMode('${mode}')"]`).classList.add('active');
        document.getElementById('text-area').className = mode === 'text' ? 'visible' : '';
        document.getElementById('voice-area').className = mode === 'voice' ? 'visible' : '';
    }

    function sendText() {
        const input = document.getElementById('msg-input');
        if(!input.value) return;

        // Reset idle timer because we are interacting
        if (typeof resetIdleTimer === "function") resetIdleTimer();

        socket.emit('user_message', { message: input.value });
        input.value = '';
        document.getElementById('response-text').style.display = 'none';
    }
    document.getElementById('msg-input').addEventListener('keypress', (e) => { if(e.key==='Enter') sendText(); });

    // --- VOICE RECOGNITION ---
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(Recognition) {
        const rec = new Recognition(); rec.lang = 'en-US';
        const btn = document.getElementById('mic-btn');
        function startRec() { try { rec.start(); } catch(e){} btn.classList.add('listening'); btn.innerText = "Listening..."; }
        function stopRec() { rec.stop(); btn.classList.remove('listening'); btn.innerText = "Processing..."; }
        window.addEventListener('keydown', (e) => { if(e.code === 'Space' && !e.repeat) startRec(); });
        window.addEventListener('keyup', (e) => { if(e.code === 'Space') stopRec(); });
        btn.addEventListener('mousedown', startRec);
        btn.addEventListener('mouseup', stopRec);
        rec.onresult = (e) => {
            const txt = e.results[0][0].transcript;
            btn.innerText = "Sent: " + txt;
            socket.emit('user_message', { message: txt });
            if (typeof resetIdleTimer === "function") resetIdleTimer();
        };
    }

    // --- PLAYLIST SYSTEM (EMOTION QUEUE) ---
    let audioQueue = [];
    let isPlayingSequence = false;

    socket.on('speak_audio_sequence', (playlist) => {
        console.log("Received Playlist:", playlist);
        
        // Reset idle timer because she is about to speak
        if (typeof resetIdleTimer === "function") resetIdleTimer();

        // Add new items to the queue
        audioQueue = audioQueue.concat(playlist);
        
        // If not currently talking, start the queue
        if (!isPlayingSequence) {
            playNextInQueue();
        }
    });

    function playNextInQueue() {
        // 1. Check if queue is empty
        if (audioQueue.length === 0) {
            isPlayingSequence = false;
            return;
        }

        isPlayingSequence = true;
        
        // 2. Get the next segment
        const currentItem = audioQueue.shift(); 

        // 3. Update Text & Face
        if (currentItem.text) {
            const t = document.getElementById('response-text');
            t.innerText = currentItem.text; 
            t.style.display = 'block';
        }
        
        if (currentItem.emotion) {
            console.log("Switching Face to:", currentItem.emotion);
            triggerExp(currentItem.emotion);
        }

        // 4. Play Audio
        if (currentItem.audio) {
            const audio = new Audio(currentItem.audio);
            audio.crossOrigin = 'anonymous';
            
            if(audioContext) {
                const source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
            }
            
            audio.play();
            isSpeaking = true;

            // 5. WHEN DONE: Recursion!
            audio.onended = () => {
                isSpeaking = false;
                playNextInQueue(); 
            };
        } else {
            // Fallback if audio fails
            setTimeout(() => {
                playNextInQueue();
            }, 1000);
        }
    }
    
    window.addEventListener('resize', () => {
        if (app) app.renderer.resize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
