<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Astra AI (Live2D)</title>
    <link rel="stylesheet" href="/static/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.2/browser/pixi.min.js"></script>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>

<body>
    {% include 'nav.html' %}

    <canvas id="canvas"></canvas>
    
    <div id="loading">INITIALIZING NEURAL LINK...</div>

    <div id="response-text"></div>

    <div id="ui-container">
        <div class="mode-switch">
            <button class="mode-btn active" onclick="setMode('text')">⌨ TEXT</button>
            <button class="mode-btn" onclick="setMode('voice')">🎤 VOICE</button>
            <button class="mode-btn" id="screen-btn" onclick="toggleScreenShare()" style="border: 1px solid #00d2ff; color: #00d2ff;">🖥️ Watch Screen</button>
        </div>

        <div id="text-area" class="visible">
            <input type="text" id="msg-input" placeholder="Message Astra..." autocomplete="off">
            <button class="send-btn" onclick="sendText()">SEND</button>
        </div>

        <div id="voice-area">
            <button id="mic-btn">Hold SPACE to Speak</button>
            
            <button id="auto-mode-btn" onclick="toggleConversationMode()" 
                style="margin-top: 5px; background: transparent; border: 1px solid #555; color: #aaa; font-size: 12px; padding: 5px 10px; border-radius: 10px;">
                🔄 Auto-Chat: OFF
            </button>
        </div>
    </div>

    <script src="/static/js/globals.js"></script>
    <script src="/static/js/model-manager.js"></script>
    <script src="/static/js/audio-manager.js"></script>
    <script src="/static/js/ui-handler.js"></script>
    <script src="/static/js/live2d-motions.js"></script>

    <script>
        window.onload = function() {
            initPixi();
            
            // --- AUTO-HIDE SUBTITLES ---
            const subtitleBox = document.getElementById('response-text');
            
            // Create an observer to watch for text changes
            const observer = new MutationObserver(function(mutations) {
                if (subtitleBox.innerText.trim().length > 0) {
                    subtitleBox.classList.add('visible');
                    
                    // Optional: Auto-hide after 10 seconds of no updates
                    clearTimeout(window.subtitleTimer);
                    window.subtitleTimer = setTimeout(() => {
                        subtitleBox.classList.remove('visible');
                    }, 10000);
                } else {
                    subtitleBox.classList.remove('visible');
                }
            });

            observer.observe(subtitleBox, { childList: true, characterData: true, subtree: true });
        };
    </script>
</body>
</html>
