<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Astra AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/three@0.142.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.142.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.11/lib/three-vrm.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>

<body>
    <a href="/" class="switch-link">➡ SWITCH TO 2D</a>

    <div id="click-overlay"><div>▶ CLICK TO WAKE UP</div></div>
    <div id="loading">Loading Model...</div>
    <div id="canvas-container"></div>

    <div id="response-text"></div>

    <div id="ui-container">
        <div class="mode-switch">
            <button class="mode-btn active" onclick="setMode('text')">⌨ TEXT</button>
            <button class="mode-btn" onclick="setMode('voice')">🎤 VOICE</button>
        </div>
        <div id="text-area" class="visible">
            <input type="text" id="msg-input" placeholder="Type message..." autocomplete="off">
            <button class="send-btn" onclick="sendText()">SEND</button>
        </div>
        <div id="voice-area">
            <button id="mic-btn">Hold SPACE to Speak</button>
        </div>
    </div>

    <script src="/static/live3d/movements.js"></script>

<script>
    let audioContext, analyser, dataArray, isSpeaking = false;
    let currentVrm = null;
    const socket = io();

    document.getElementById('click-overlay').addEventListener('click', function() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        if(audioContext.state === 'suspended') audioContext.resume();
        this.style.display = 'none';
    });

    function setMode(mode) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.mode-btn[onclick="setMode('${mode}')"]`).classList.add('active');
        document.getElementById('text-area').className = mode === 'text' ? 'visible' : '';
        document.getElementById('voice-area').className = mode === 'voice' ? 'visible' : '';
    }

    function sendText() {
        const input = document.getElementById('msg-input');
        if(!input.value) return;
        socket.emit('user_message', { message: input.value });
        input.value = '';
        document.getElementById('response-text').style.display = 'none';
    }
    document.getElementById('msg-input').addEventListener('keypress', (e) => { if(e.key==='Enter') sendText(); });

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(Recognition) {
        const rec = new Recognition(); rec.lang = 'en-US';
        const btn = document.getElementById('mic-btn');
        function startRec() { try { rec.start(); } catch(e){} btn.classList.add('listening'); btn.innerText = "Listening..."; }
        function stopRec() { rec.stop(); btn.classList.remove('listening'); btn.innerText = "Processing..."; }
        window.addEventListener('keydown', (e) => { if(e.code === 'Space' && !e.repeat) startRec(); });
        window.addEventListener('keyup', (e) => { if(e.code === 'Space') stopRec(); });
        btn.addEventListener('mousedown', startRec);
        btn.addEventListener('mouseup', stopRec);
        rec.onresult = (e) => {
            const txt = e.results[0][0].transcript;
            btn.innerText = "Sent: " + txt;
            socket.emit('user_message', { message: txt });
            setTimeout(() => btn.innerText = "Hold SPACE to Speak", 2000);
        };
    }

    socket.on('speak_audio', (data) => {
        if (data.text) {
            const t = document.getElementById('response-text');
            t.innerText = data.text; t.style.display = 'block';
        }
        if(data.url) {
            const audio = new Audio(data.url);
            audio.crossOrigin = 'anonymous';
            if(audioContext) {
                const source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
            }
            audio.play();
            isSpeaking = true;
            audio.onended = () => { isSpeaking = false; animateMouth(currentVrm, null, null, false); };
        }
    });

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.1, 20);
    camera.position.set(0, 1.0, 2.3); 
    
    new THREE.GLTFLoader().load('/static/live3d/astra.vrm', (gltf) => {
        THREE.VRM.from(gltf).then(vrm => {
            vrm.scene.rotation.y = Math.PI;
            scene.add(vrm.scene);
            currentVrm = vrm;
            scene.add(new THREE.DirectionalLight(0xffffff, 2));
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            document.getElementById('loading').style.display = 'none';
        });
    });

    window.addEventListener('resize', () => { 
        renderer.setSize(window.innerWidth, window.innerHeight); 
        camera.aspect = window.innerWidth/window.innerHeight; 
        camera.updateProjectionMatrix(); 
    });

    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        
        if(currentVrm) {
            currentVrm.update(delta);
            const time = clock.elapsedTime;
            
            animateBody(currentVrm, time, isSpeaking);
            animateMouth(currentVrm, analyser, dataArray, isSpeaking);
        }
        
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
