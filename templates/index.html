<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Astra AI</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background-color: #2b2b2b;
}
#canvas-container {
    width: 100vw;
    height: 100vh;
}
#loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-family: sans-serif;
    font-size: 24px;
    background: rgba(0,0,0,0.7);
    padding: 20px;
    border-radius: 10px;
}
</style>

<!-- THREE (legacy, VRM-compatible) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.142.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.142.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- three-vrm (VRM 0.0) -->
<script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.11/lib/three-vrm.js"></script>

<!-- socket.io -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>

<body>
<div id="loading">Connecting to Neural Network...</div>
<div id="canvas-container"></div>

<script>
/* ===============================
   AUDIO STATE (DECLARE FIRST)
================================ */

let audioContext = null;
let analyser = null;
let dataArray = null;
let isSpeaking = false;

/* ===============================
   SOCKET
================================ */

const socket = io();

/* ===============================
   THREE SETUP
================================ */

const container = document.getElementById('canvas-container');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(1, 1, 1);
scene.add(light);

const camera = new THREE.PerspectiveCamera(
    30,
    window.innerWidth / window.innerHeight,
    0.1,
    20
);
camera.position.set(0, 1.4, 1.5);
camera.lookAt(0, 1.3, 0);

/* ===============================
   LOAD VRM
================================ */

const loader = new THREE.GLTFLoader();
let currentVrm = null;

loader.load(
    '/static/astra.vrm',
    (gltf) => {
        THREE.VRM.from(gltf).then((vrm) => {
            vrm.scene.rotation.y = Math.PI;
            scene.add(vrm.scene);
            currentVrm = vrm;
            document.getElementById('loading').style.display = 'none';
            console.log('VRM loaded ✔');
        });
    },
    undefined,
    (err) => {
        console.error(err);
        document.getElementById('loading').innerText =
            'VRM LOAD FAILED (check path or VRM version)';
    }
);

/* ===============================
   ANIMATION LOOP
================================ */

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    if (currentVrm) {
        currentVrm.update(delta);

        const chest = currentVrm.humanoid.getBoneNode(
            THREE.VRMSchema.HumanoidBoneName.Chest
        );
        if (chest) {
            chest.rotation.x = Math.sin(clock.elapsedTime) * 0.03;
        }
    }

    updateMouth();
    renderer.render(scene, camera);
}

animate();

/* ===============================
   AUDIO + LIP SYNC
================================ */

socket.on('speak_audio', (data) => {
    playAudio(data.url);
});

function playAudio(url) {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    const audio = new Audio(url);
    audio.crossOrigin = 'anonymous';

    const source = audioContext.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioContext.destination);

    audio.play().catch(() => {});
    isSpeaking = true;

    audio.onended = () => {
        isSpeaking = false;
    };
}

function updateMouth() {
    if (
        !isSpeaking ||
        !analyser ||
        !dataArray ||
        !currentVrm ||
        !currentVrm.blendShapeProxy
    ) return;

    analyser.getByteFrequencyData(dataArray);

    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    const volume = sum / dataArray.length;

    currentVrm.blendShapeProxy.setValue(
        THREE.VRMSchema.BlendShapePresetName.A,
        Math.min(1, volume / 25)
    );
}

/* ===============================
   EVENTS
================================ */

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('click', () => {
    if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
    }
});
</script>
</body>
</html>
